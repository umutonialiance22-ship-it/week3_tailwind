<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind css work</title>
</head>
<body class="bg-gray-100 p-8">
    
<!-- Part 2: Profile Card -->
<div class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300 text-center">

  <!-- Photo placeholder -->
  <div class="w-24 h-24 mx-auto mb-4 rounded-full bg-emerald-100 flex items-center justify-center text-3xl font-bold text-emerald-700">
    <img src="umutoni_aliance_passport_photo.jpeg" alt="Umutoni Aliance" class="w-full h-full object-cover rounded-full">
  </div>

  <h1 class="text-2xl font-bold text-gray-800 mb-2">
    Umutoni Aliance
  </h1>

  <p class="text-gray-600 mb-4">
    Software Engineering student passionate about full stack development
    and building useful applications.
  </p>

  <!-- Skill tags -->
  <div>
    <span class="inline-block text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">
      Python
    </span>

    <span class="inline-block text-xs px-2 py-1 rounded-full bg-teal-100 text-teal-700">
      Django
    </span>
    <span class="inline-block bg-pink-100 text-pink-700 rounded-full text-xs px-2 py-1 ">HTML</span>
    <span class="inline-block bg-blue-100 text-blue-700 rounded-full text-xs px-2 py-1 ">CSS</span>
  </div>

</div>
    
</body>
</html>
