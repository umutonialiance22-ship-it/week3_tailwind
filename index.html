<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind css</title>
</head>

<body>
    <h1 class="text-red-500 font-bold leading-tight text-center">hello world</h1>
    <div class="bg-green-500 text-white p-4 w-50 text-center m-8 font-bold border-2 rounded-full cursor-pointer shadow-xl hover:bg-green-700 transition duration-300">

    </div>

        Checkout
    </button>
</body>

</html>
